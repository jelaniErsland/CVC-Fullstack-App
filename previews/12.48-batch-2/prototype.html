<script>

const people={gate:[['Avery Stone','confirmed']],food:[['Avery Stone','confirmed'],['Jordan Hale','needs_response'],['Casey Morgan','declined']],cleanup:[['Avery Stone','confirmed'],['Jordan Hale','needs_response'],['Casey Morgan','declined'],['Morgan Reed','confirmed'],['Riley Brooks','confirmed'],['Taylor Quinn','needs_response']]};
const items=[
 {id:'breakfast',date:'2026-10-05',title:'Breakfast',start:'8:00 AM',end:'11:00 AM',kind:'meal',total:null,contact:'Avery Stone'},
 {id:'site',date:'2026-10-05',title:'Site preparation',start:'8:00 AM',end:'12:00 PM',kind:'work',fraction:'0/6',people:[]},

const labels={confirmed:'Confirmed',needs_response:'Awaiting reply',declined:"Can't make it"};
function icon(k){return `<svg class="status-icon ${k==='needs_response'?'pending':k}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${labels[k]}"><title>${labels[k]}</title>${statusSvg[k]}</svg>`}
function roster(row,max=3){if(quick||bearer||row.kind==='meal')return '';const a=row.people||[];if(!a.length)return '<span class="agenda-sub">No volunteers assigned</span>';return `<div class="roster">${a.slice(0,max).map(([name,s])=>`<span class="person"><span class="name">${name}</span>${icon(s)}</span>`).join('')}${a.length>max?`<span class="extra-people" hidden>${a.slice(max).map(([name,s])=>`<span class="person"><span class="name">${name}</span>${icon(s)}</span>`).join('')}</span><button class="more-people" type="button" aria-expanded="false" data-more="${a.length-max}" aria-label="Show ${a.length-max} more volunteers">+${a.length-max} more</button>`:''}</div>`}
function legend(){return quick||bearer?'':`<div class="status-legend" aria-label="Assignment response legend"><strong>Responses</strong><span>${icon('confirmed')} Confirmed</span><span>${icon('needs_response')} Awaiting reply</span><span>${icon('declined')} Can't make it</span></div>`}

function iso(d){return new Date(d+'T12:00:00Z')}
function longDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'}).format(iso(d))}
function shortDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(iso(d))}
function dayRows(d){return items.filter(x=>x.date===d)}
function eventEdge(row){return row.kind==='meal'?'meal-edge':row.kind==='context'?'context-edge':''}
function agendaCard(row){return `<article class="agenda-item ${eventEdge(row)}"><div class="agenda-time">${row.start.replace(' AM','a').replace(' PM','p')}</div><div class="agenda-body"><div class="agenda-title">${row.title}</div><div class="agenda-sub">${scheduleLabel(row)}${row.kind==='meal'?' · Main contact: '+(row.contact||'Not assigned'):''}</div>${roster(row)}</div><div class="count">${row.kind==='meal'?(row.total===null?'Not set':row.total):row.fraction}</div></article>`}
function agenda(d){const rows=dayRows(d);return `<section class="selection-agenda"><h2>${longDate(d)}</h2><p class="hint">${rows.length} scheduled items · Select an item for details</p><div class="agenda-list">${rows.length?rows.map(agendaCard).join(''):'<p>No scheduled items.</p>'}</div><a class="agenda-link" href="?view=day&date=${d}${quick?'&mode=quick':''}">Open Day view →</a></section>`}
function mealSummary(d){const meals=dayRows(d).filter(x=>x.kind==='meal');return `<section class="meal-summary" aria-label="Daily meal headcounts"><div class="label">Meal headcounts · ${shortDate(d)} <span style="font-weight:500;color:var(--muted)">(selected day)</span></div>${['Breakfast','Lunch'].map(name=>{const m=meals.find(x=>x.title===name);return `<div class="meal-card"><div class="name">${name}</div><div class="amount">${m?(m.total===null?'Not recorded':m.total):'Not scheduled'}</div><div class="contact">${m?'Main contact: '+(m.contact||'Not assigned'):'No meal on this date'}</div></div>`}).join('')}</section>`}
function month(){const first=new Date(Date.UTC(2026,9,1)),start=new Date(first);start.setUTCDate(first.getUTCDate()-first.getUTCDay());const dates=Array.from({length:35},(_,i)=>{const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);return d.toISOString().slice(0,10)});return `${quick||bearer?mealSummary(selected):''}<div class="month-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div><div class="month-grid">${dates.map(d=>{const rows=dayRows(d),out=d.slice(5,7)!=='10';return `<div class="month-cell ${out?'outside':''} ${d===selected?'selected':''}" data-date="${d}"><button class="date-number" type="button" aria-label="Select ${longDate(d)}, ${rows.length} items" onclick="location.href='?view=month&date=${d}${quick?'&mode=quick':''}'">${Number(d.slice(-2))}</button><div class="month-events">${rows.slice(0,3).map(r=>`<span class="month-event ${r.kind}">${r.kind==='meal'?r.title+' · '+(r.total===null?'—':r.total):r.title}</span>`).join('')}${rows.length>3?`<span class="more-event">+${rows.length-3} more · open day</span>`:''}</div><div class="compact-indicators" aria-hidden="true">${rows.slice(0,3).map(r=>`<span class="dot ${r.kind==='meal'?'mealdot':r.kind==='context'?'contextdot':''}"></span>`).join('')}${rows.length>3?`<span class="busy-count">${rows.length}</span>`:''}</div></div>`}).join('')}</div>${agenda(selected)}`}
function list(){const dates=['2026-10-05','2026-10-06','2026-10-07'];return `${legend()}${dates.map(d=>`<div class="list-day">${longDate(d)} <span style="float:right;color:var(--muted);font-weight:500">${dayRows(d).length} items</span></div>${dayRows(d).map(r=>`<div class="list-row"><div><div class="list-title">${r.title}</div>${r.kind==='meal'?`<div class="list-meta">Main meal contact: ${r.contact||'Not assigned'}</div>`:''}</div><div class="list-time">${scheduleLabel(r)}</div><div class="list-count">${count(r)}</div><div class="list-roster">${roster(r)}</div></div>`).join('')}`).join('')}`}
function card(row){return `<article class="day-card ${row.kind==='meal'?'meal-card-event':''}"><div class="row-top"><div><div class="title">${row.title}</div><div class="time">${scheduleLabel(row)}</div></div><div class="fraction">${count(row)}</div></div><div class="row-bottom">${row.kind==='meal'?`<span class="agenda-sub">Main meal contact: ${row.contact||'Not assigned'}</span>`:roster(row)}</div></article>`}
function day(){const rows=dayRows(selected);return `${quick||bearer?mealSummary(selected):''}${legend()}<div class="day-title"><strong>Project day · ${shortDate(selected)}</strong><a href="#">Day details</a></div><div class="day-stack">${['7 AM','8 AM','9 AM','10 AM','11 AM','12 PM'].map((t,i)=>`<div class="day-hour">${t}</div><div class="day-slot">${rows.filter(r=>r.start.startsWith(String(i+7)+':') || (i===5&&r.start.startsWith('12:'))).map(card).join('')}</div>`).join('')}</div>`}
function week(){const dates=['2026-10-05','2026-10-06','2026-10-07','2026-10-08','2026-10-09','2026-10-10','2026-10-11'];const slots=['7 AM','8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM'];const desktop=`${legend()}<div class="week-grid"><div></div>${dates.map(d=>`<div class="week-head">${shortDate(d)}<small>${dayRows(d).length} items</small></div>`).join('')}${slots.map((slot,i)=>`<div class="week-time">${slot}</div>${dates.map(d=>{const rows=dayRows(d).filter(r=>r.start.startsWith(String(i+7)+':')||(i===5&&r.start.startsWith('12:')));return `<div class="week-cell">${rows.slice(0,2).map(r=>`<span class="week-event ${r.kind==='meal'?'meal-event':''}">${r.title}<span class="sub">${r.start} · ${r.kind==='meal'?(r.total===null?'Not set':r.total):r.fraction}</span></span>`).join('')}${rows.length>2?`<span class="week-more">+${rows.length-2} more · Day</span>`:''}</div>`}).join('')}`).join('')}</div>`;const mobile=`<div class="mobile-week">${dates.map(d=>{const rows=dayRows(d);return `<section class="week-day ${d===selected?'selected-week-day':''}"><h2>${shortDate(d)}<span>${rows.length} ${rows.length===1?'item':'items'}</span></h2><div class="week-day-list">${rows.length?rows.map(r=>`<div class="week-day-item ${r.kind==='meal'?'meal-day-item':''}"><strong>${r.title}</strong><small>${scheduleLabel(r)} · ${count(r)}</small></div>`).join(''):'<p class="week-day-empty">No scheduled items</p>'}</div></section>`}).join('')}</div>`;return desktop+mobile}
const title=quick||bearer?'Project Quick View':'Calendar';const period=view==='month'?'October 2026':view==='day'?shortDate(selected)+', 2026':'Oct 5 to Oct 11, 2026';
document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="pin"><span>♧</span></span>Project Local</div><div class="project-box"><small>Current project</small>LDC Community remodel · Fixture</div><nav>${['Overview','Calendar','Volunteers','Attention','Task library','Communications','Quick View'].map(x=>`<a class="side-link ${x===(quick||bearer?'Quick View':'Calendar')?'active':''}" href="#">${x}</a>`).join('')}</nav></aside><header class="mobile-top"><div class="pin"><span>♧</span></div><div><div class="brand">Project Local</div><span class="project-name">LDC Community remodel · Fixture</span></div></header><main class="main"><div class="page-head"><h1>${title}</h1>${quick||bearer?'<span style="font-size:13px;color:var(--muted)">Read-only project schedule</span>':'<button class="secondary" type="button">➤ &nbsp;Send schedules</button>'}</div><section class="workspace"><div class="toolbar"><div class="period"><strong>${period}</strong><small>${items.length} items · All project work</small></div><div class="nav-group"><button type="button" aria-label="Previous ${view}">‹</button><button class="today" type="button">Today</button><button type="button" aria-label="Next ${view}">›</button></div><div class="toolbar-actions"><button class="secondary hide-mobile" type="button">Day details</button><button class="secondary" type="button">Project</button><button class="secondary" type="button" aria-label="Filters" title="Filters">☷</button>${quick||bearer?'':'<button class="primary" type="button">+ Create</button>'}</div><div class="view-tabs" role="group" aria-label="Calendar view">${['Day','Week','Month','List'].map(v=>`<button type="button" class="${view===v.toLowerCase()?'active':''}" onclick="location.href='?view=${v.toLowerCase()}&date=${selected}${quick?'&mode=quick':''}'">${v}</button>`).join('')}</div><div class="toolbar-bottom">Project dates · Sep 29 – Dec 4 <span style="color:var(--blue);font-weight:700">Details ▾</span></div></div>${view==='month'?month():view==='list'?list():view==='day'?day():week()}</section></main><nav class="bottom-nav" aria-label="Primary navigation">${['Overview','Calendar','Volunteers','Attention','More'].map((x,i)=>`<a href="#" class="${(quick||bearer?x==='More':x==='Calendar')?'active':''}"><span>${['⌂','▦','♙','♧','•••'][i]}</span>${x}</a>`).join('')}</nav></div>`;
document.addEventListener('click',event=>{const button=event.target.closest('.more-people');if(!button)return;const extra=button.previousElementSibling;extra.hidden=!extra.hidden;button.setAttribute('aria-expanded',String(!extra.hidden));button.textContent=extra.hidden?`+${button.dataset.more} more`:'Show less';button.setAttribute('aria-label',extra.hidden?`Show ${button.dataset.more} more volunteers`:'Show fewer volunteers')});
document.querySelector('.period small').textContent=`${view==='day'?dayRows(selected).length:items.length} items · All project work`;
if(quick||bearer)document.querySelector('.page-head').classList.add('quick-head');
const toolbarButtons=document.querySelectorAll('.toolbar-actions button');
toolbarButtons[2].innerHTML='<span class="desktop-only">☷ &nbsp;Filters</span><span class="mobile-only">☷</span>';
if(toolbarButtons[3])toolbarButtons[3].innerHTML='<span class="desktop-only">+ Create item</span><span class="mobile-only">+ Create</span>';
</script></body></html>
